# İş Pusulası backend — nginx reverse proxy (host'ta çalışır).
# Kurulum (EC2'de):
#   sudo cp deploy/nginx-ispusulasi.conf /etc/nginx/sites-available/ispusulasi
#   sudo ln -s /etc/nginx/sites-available/ispusulasi /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# Sonra HTTPS (certbot 443 bloğunu otomatik ekler + sertifika alır):
#   sudo certbot --nginx -d api.senin-domainin.com

server {
    listen 80;
    server_name api.senin-domainin.com;   # <-- kendi subdomain'inle değiştir

    # CV upload 10MB'a kadar (Spring tarafındaki limitle aynı)
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
