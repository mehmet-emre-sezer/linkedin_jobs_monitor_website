spring.application.name=backend

# --- PostgreSQL connection ---
# Secret degerler application-local.properties (lokal) veya env (prod) uzerinden gelir
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jobradar_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- CV upload (PDF max 10MB) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- JPA / Hibernate ---
# validate: keeps existing tables intact, only checks entity <-> table mapping
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# --- JWT ---
# secret must be at least 32 chars (256 bit) for HS256
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# --- Gemini (LLM skorlama, OpenAI-uyumlu endpoint) ---
# api-key secret -> application-local.properties (lokal) / env (prod)
app.gemini.api-key=${GEMINI_API_KEY}
app.gemini.base-url=https://generativelanguage.googleapis.com/v1beta/openai
app.gemini.model=gemini-3.8-flash

# --- Tarama (scan) ---
app.scan.score-threshold=70
app.scan.jobs-per-query=5
# Her aksam 20:00 (saniye dakika saat gun ay haftagunu)
app.scan.cron=0 0 20 * * *

# --- Telegram (bos ise mock mod: mesaj konsola yazilir, gercek istek atilmaz) ---
app.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}

# Lokal gelistirmede secret'lar bu dosyadan gelir (git'e girmez, optional).
# Prod'da bu dosya yoktur; degerler ortam degiskeni (env) olarak saglanir.
spring.config.import=optional:application-local.properties
