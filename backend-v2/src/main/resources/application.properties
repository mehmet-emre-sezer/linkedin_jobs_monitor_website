spring.application.name=backend

# --- PostgreSQL connection ---
# Secret degerler application-local.properties (lokal) veya env (prod) uzerinden gelir
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jobradar_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- CV upload (PDF max 10MB) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- JPA / Hibernate ---
# validate: keeps existing tables intact, only checks entity <-> table mapping
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# --- JWT ---
# secret must be at least 32 chars (256 bit) for HS256
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# --- Gemini (LLM skorlama, OpenAI-uyumlu endpoint) ---
# api-key secret -> application-local.properties (lokal) / env (prod)
app.gemini.api-key=${GEMINI_API_KEY}
app.gemini.base-url=https://generativelanguage.googleapis.com/v1beta/openai
app.gemini.model=gemini-3.8-flash

# --- Proxy (IPRoyal; bos ise proxy'siz dogrudan baglanir) ---
app.proxy.host=${PROXY_HOST:}
app.proxy.port=${PROXY_PORT:0}
app.proxy.username=${PROXY_USERNAME:}
app.proxy.password=${PROXY_PASSWORD:}

# --- Tarama (scan) ---
app.scan.score-threshold=70
app.scan.jobs-per-query=5
# Her aksam 20:00 (saniye dakika saat gun ay haftagunu)
app.scan.cron=0 0 20 * * *
# Dashboard'da gosterilecek sonraki tarama saati etiketi
app.scan.next-scan-at=20:00

# --- Telegram (bos ise mock mod: mesaj konsola yazilir, gercek istek atilmaz) ---
app.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
app.telegram.bot-username=${TELEGRAM_BOT_USERNAME:ispusulasi_bot}
app.telegram.link-expire-minutes=15
app.telegram.webhook-secret=${TELEGRAM_WEBHOOK_SECRET:}

# --- Email (Resend; key bos ise mock mod: mail konsola yazilir) ---
app.email.resend-api-key=${RESEND_API_KEY:}
app.email.from=${EMAIL_FROM:onboarding@resend.dev}
app.email.verification-expire-minutes=1440
app.email.password-reset-expire-minutes=60

# --- Frontend adresi (email linkleri icin) ---
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# --- CORS (virgulle ayrilmis izinli origin'ler) ---
app.cors.origins=${CORS_ORIGINS:http://localhost:3000}

# --- Google OAuth (id_token dogrulamasi icin client id) ---
app.google.client-id=${GOOGLE_CLIENT_ID:}

# Lokal gelistirmede secret'lar bu dosyadan gelir (git'e girmez, optional).
# Prod'da bu dosya yoktur; degerler ortam degiskeni (env) olarak saglanir.
spring.config.import=optional:application-local.properties
